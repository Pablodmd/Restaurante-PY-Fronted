name: restaurante_py
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the build number may be overridden by specifying --build-name
# and --build-number, respectively.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_slidable: ^3.0.0
  provider: ^6.1.1
  intl: ^0.18.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

# Dev dependencies are packages needed for development but not included in the app
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package contains recommended lints for good coding practices
  flutter_lints: ^5.0.0

  # Paquete para configurar la splash screen nativa
  flutter_native_splash: ^2.4.7

  flutter_launcher_icons: ^0.14.4

# Configuración de la splash screen nativa
# Esto se ejecuta con `flutter pub run flutter_native_splash:create`
flutter_native_splash:
  color: "#2C2C2C"
  image: assets/images/RestaurantLogo.png

  android: true
  ios: true
  fullscreen: true

  android_12:
    image: assets/images/RestaurantLogo.png
    icon_background_color: "#2C2C2C"
    color: "#2C2C2C"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LogoApp.png"
# Flutter assets y fonts
flutter:
  # The following line ensures that the Material Icons font is included with your application
  uses-material-design: true

  # To add assets to your application, add them here
  # For example, images or logos
  assets:
    - assets/images/

  # To add custom fonts to your application, add a fonts section here
  # Each entry should have a "family" key and a "fonts" list
  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
